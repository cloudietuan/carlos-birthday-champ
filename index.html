function update(dt){if(paused)return;time+=dt;if(state==='surprise'){surpriseTime+=dt;if(surpriseTime>=3.5&&!party){party=true;$('help').textContent='go on. open it.';burst(320,100,'#ffdc79',100);overlay('SURPRISE','SURPRISE, CARLOS!','somehow, you’re finally strong enough to get this present.','OPEN YOUR PRESENT',openPresent);celebration()}if(party&&Math.random()<dt*18)burst(Math.random()*640,40,['#ffdc79','#ef8f9d','#8ad6bf'][Math.floor(Math.random()*3)],2)}shake=Math.max(0,shake-dt);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=250*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);if(state==='story'){let direction=(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0);x=Math.max(60,Math.min(580,x+direction*220*dt));$('interact').textContent=Math.abs(x-110)<75?'OPEN [E]':Math.abs(x-330)<80?'TRAIN [E]':Math.abs(x-530)<80?(chapter===0?'TALK [E]':'FIGHT [E]'):'INTERACT [E]';}if(state==='play'){let direction=(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0);x=Math.max(65,Math.min(575,x+direction*260*dt));if(round===1){spawn-=dt;if(spawn<=0){let gift=Math.random()<.72;items.push({x:80+Math.random()*480,y:96,type:gift?'gift':'slice',color:['#62b7a1','#e3a55f','#9b91cc'][Math.floor(Math.random()*3)],speed:gift?50:105});spawn=.7}}else{bossX=320+Math.sin(time*.8)*155;bossTimer-=dt;if(bossTimer<=0){items.push({x:x+(Math.random()-.5)*80,y:166,type:'slice',speed:120});bossTimer=.9}}for(let o of items){if(o.dead)continue;o.y+=o.speed*dt;if(o.type==='gift'&&o.y>295)o.dead=true;if(o.type==='slice'&&Math.abs(o.x-x)<27&&Math.abs(o.y-259)<25){o.dead=true;hurt()}if(o.y>315)o.dead=true}items=items.filter(o=>!o.dead)}else if(state==='dance'){danceTime+=dt;beatTimer-=dt;if(beatTimer<=0){beep(danceTotal%4===0?110:220,.04,'triangle');beatTimer=.325}noteTimer-=dt;if(danceTime<17.5&&noteTimer<=0){notes.push({lane:Math.floor(Math.random()*4),y:86});danceTotal++;noteTimer=.65}for(let n of notes){n.y+=110*dt;if(n.y>311)n.dead=true}notes=notes.filter(n=>!n.dead);if(dance
